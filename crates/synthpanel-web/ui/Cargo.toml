[package]
name = "synthpanel-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Slint user interface for SynthPanel, compiled to WebAssembly"
license = "AGPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = "1.19"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
