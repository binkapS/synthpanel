name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt

      - name: Install wasm-bindgen & audit/deny
        run: |
          cargo install -q wasm-bindgen-cli --version 0.2.130
          cargo install -q cargo-audit
          cargo install -q cargo-deny

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: cargo-audit
        run: cargo audit

      - name: cargo-deny
        run: cargo deny check

      - name: Build release
        run: cargo build --release --workspace

      - name: Build .deb
        run: VERSION=0.1.0 packaging/build-deb.sh

      - name: Self-update integration test
        run: tests/update.sh

      - name: Chaos test (apply pipeline rollback)
        run: tests/chaos.sh

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: |
          cargo install -q wasm-bindgen-cli --version 0.2.130

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build WASM UI
        working-directory: crates/synthpanel-web
        run: bash ui/build-ui.sh

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: e2e/run.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build docs site
        working-directory: docs-site
        run: |
          npm install --no-audit --no-fund
          npm run build
